# Stack mínima para o app desktop (.exe): só API + Postgres.
# Uso: docker compose -f docker-compose.desktop.yml up -d --build
# UI = Electron / instalador — não sobe o serviço web.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fattovirtual
      POSTGRES_USER: fatto
      POSTGRES_PASSWORD: fatto_dev_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata_desktop:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatto -d fattovirtual"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=fattovirtual;Username=fatto;Password=fatto_dev_password
      Jwt__Key: FattoVirtual_Dev_Signing_Key_Change_In_Production_32chars_min
      Jwt__Issuer: FattoVirtual
      Jwt__Audience: FattoVirtual
      Security__CredentialEncryptionKey: FattoVirtualDevKey_ChangeMe_32b!
      EmailKit__OutboxDirectory: /app/email-outbox
      WhatsAppKit__OutboxDirectory: /app/whatsapp-outbox
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_desktop:
