<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=mona-m2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=mona-m2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>MONA</title>
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem('fatto_theme')
        document.documentElement.dataset.tenant = 'mona'
        if (t === 'dark') {
          document.documentElement.classList.add('dark')
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
